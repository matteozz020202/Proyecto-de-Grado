<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} · Cancha Lista</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">{% include 'users/partials/navbar.html' %}
<main class="container py-5" style="max-width: 680px"><h1>{{ title }}</h1>
{% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}
{% if profile %}<p>Usuario: {{ request.user.username }}</p>{% endif %}
<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">{{ form.as_p }}<button type="submit" class="btn btn-primary">{% if profile %}Guardar cambios{% else %}Continuar{% endif %}</button></form>
{% if profile %}<p class="mt-4"><a href="{% url 'users:password_change' %}">Cambiar contraseña</a></p>{% endif %}
</main></body></html>
